<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found · Muhammad Zeeshan</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F3DF0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFBFC; --card: #FFFFFF; --ink: #0C0E11;
    --gray-600: #565D66; --gray-500: #7A828C; --line: #E2E5E9;
    --blue: #1F3DF0;
    --font-sans: "Archivo", -apple-system, "Helvetica Neue", Helvetica, sans-serif;
    --font-mono: "Fragment Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; width: 100%; }
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 12px; height: 76px; }
  .mark { width: 34px; height: 34px; background: var(--blue); color: #fff; display: grid; place-items: center; font: 700 13px var(--font-mono); letter-spacing: 0.04em; border-radius: 4px; }
  main { flex: 1; display: grid; place-items: center; text-align: center; padding: 96px 0; }
  .code { font: 400 13px var(--font-mono); letter-spacing: 0.16em; color: var(--gray-500); text-transform: uppercase; }
  h1 { font: 600 44px/1.1 var(--font-sans); letter-spacing: -0.025em; margin: 18px 0 0; }
  p { font: 400 17px/1.6 var(--font-sans); color: var(--gray-600); margin: 16px auto 0; max-width: 460px; }
  .cta { display: inline-block; margin-top: 32px; padding: 14px 22px; background: var(--ink); color: #fff; border-radius: 2px; font: 500 14px var(--font-sans); }
  .cta:hover { text-decoration: none; opacity: 0.9; }
  footer { border-top: 1px solid var(--line); }
  footer .wrap { padding: 28px 24px; font: 400 11px var(--font-mono); letter-spacing: 0.1em; color: var(--gray-500); text-transform: uppercase; }
</style>
</head>
<body>
  <header><div class="wrap"><a class="mark" href="/">MZ</a><a href="/" style="color: var(--ink); font: 600 15px/1 var(--font-sans);">Muhammad Zeeshan</a></div></header>
  <main>
    <div class="wrap">
      <div class="code">Error 404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for does not exist or has moved. Let us get you back on track.</p>
      <a class="cta" href="/">Back To Home</a>
    </div>
  </main>
  <footer><div class="wrap">Muhammad Zeeshan · AI Systems Consulting · Dubai, UAE</div></footer>
</body>
</html>
